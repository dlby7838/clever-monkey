[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-platform"
version = "0.1.0"
description = "Read-only NAS video inventory for P0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
material-search = "material_search.cli:main"
video-analyze = "video_understanding.cli:main"
nas-scanner = "nas_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["nas_scanner*", "video_understanding*", "material_search*"]
