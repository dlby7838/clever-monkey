[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-platform"
version = "0.1.0"
description = "Read-only NAS video inventory for P0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nas-scanner = "nas_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["nas_scanner*"]
