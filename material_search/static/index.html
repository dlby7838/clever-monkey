<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材检索 · Clever Monkey</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/">CM<span>CLEVER MONKEY</span></a><span class="local">● 本地素材工作台</span></header>
<main><div class="intro"><div><p class="eyebrow">素材库 / P2 检索验证</p><h1>找到你需要的镜头。</h1><p class="muted">从拍摄素材中查找动作与场景，预览画面，记录哪些结果真正有用。</p></div><div class="stats"><strong id="assets">—</strong><span>条已入库素材</span></div></div>
<form id="search-form"><div class="searchbar"><label class="sr" for="query">搜索素材</label><input id="query" name="q" placeholder="输入关键词，例如：燕麦 倒入" autocomplete="off"><button class="primary" type="submit">搜索素材 <span>↗</span></button></div><div class="search-help">多个关键词用空格分隔，结果需同时包含全部关键词。当前为关键词检索。</div>
<details class="filters"><summary>筛选条件</summary><div class="filter-grid"><label>主体<input name="subject" placeholder="例如：碗"></label><label>动作<input name="action" placeholder="例如：舀起"></label><label>最短时长（秒）<input name="min" type="number" min="0" step="0.1"></label><label>最长时长（秒）<input name="max" type="number" min="0" step="0.1"></label><label>校验状态<select name="review"><option value="">全部</option><option value="needs_review">机械校验待复核</option><option value="not_reviewed">内容尚未人工验收</option></select></label><label class="checkbox"><input name="ocr" type="checkbox" value="1">加入画面文字</label></div></details></form>
<div class="workspace-head"><h2 id="result-heading">素材列表</h2><span id="feedback-count" class="muted">反馈单独保存，模型原文保持不变</span></div><p id="status" role="status" aria-live="polite"></p>
<div class="workspace"><section id="results" aria-label="检索结果"></section><aside id="detail" aria-label="素材详情"><div class="placeholder"><span>▷</span><h3>选择素材查看详情</h3><p>在左侧选择镜头，查看描述与动作时间段。</p></div></aside></div>
<footer><span>Lite 分析结果 · 仅预览本地副本 · 原片不会被修改</span><button id="export" type="button" class="text-button">导出人工反馈 ↓</button></footer></main>
</body></html>
