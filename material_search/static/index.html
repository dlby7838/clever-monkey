<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材检索 · Clever Monkey</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/">CM<span>CLEVER MONKEY</span></a><span class="local">● 本地素材工作台</span></header>
<section id="login" class="login-panel" hidden><h1>访问素材工作台</h1><p class="muted">请输入管理员提供的局域网访问口令。</p><form id="login-form"><label for="password">访问口令</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button class="primary" type="submit">进入工作台</button></form><p id="login-status" role="status"></p></section>
<main id="workspace" hidden><div class="intro"><div><p class="eyebrow">素材库 / P2 检索验证</p><h1>找到你需要的镜头。</h1><p class="muted">用自然语言查找主体与动作，快速预览拍摄素材。</p></div><div class="stats"><strong id="assets">—</strong><span>条已入库素材</span></div></div>
<form id="search-form"><div class="searchbar"><label class="sr" for="query">搜索素材</label><input id="query" name="q" placeholder="描述你要的镜头，例如：把麦片倒进碗里" autocomplete="off"><button class="primary" type="submit">搜索素材 <span>↗</span></button></div><div class="search-help">默认结合语义和关键词查找，可直接输入一句话。相似程度不代表内容准确率。</div>
<details class="filters"><summary>筛选条件</summary><div class="filter-grid"><label>检索方式<select name="mode" aria-label="检索方式"><option value="hybrid">语义＋关键词</option><option value="semantic">语义检索</option><option value="keyword">关键词检索</option></select></label><label>主体<input name="subject" placeholder="例如：碗"></label><label>动作<input name="action" placeholder="例如：舀起"></label><label>最短时长（秒）<input name="min" type="number" min="0" step="0.1"></label><label>最长时长（秒）<input name="max" type="number" min="0" step="0.1"></label><label>校验状态<select name="review"><option value="">全部</option><option value="needs_review">基础校验异常</option><option value="not_reviewed">基础校验通过</option></select></label><label class="checkbox"><input name="ocr" type="checkbox" value="1">加入画面文字</label></div></details></form>
<div class="workspace-head"><h2 id="result-heading">素材列表</h2><span id="search-mode" class="muted">本地语义检索</span></div><p id="status" role="status" aria-live="polite"></p>
<div class="workspace"><section id="results" aria-label="检索结果"></section><aside id="detail" aria-label="素材详情"><div class="placeholder"><span>▷</span><h3>选择素材查看详情</h3><p>在左侧选择镜头，查看描述与动作时间段。</p></div></aside></div>
<footer><span>Lite 分析结果 · 仅预览本地副本 · 原片不会被修改</span><span>预览采用流式播放，无磁盘副本</span></footer></main>
</body></html>
